<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#001628">
  <title>FutsalMe</title>
  <meta name="description" content="FutsalMe: open packs, build a five-a-side team and play matches.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23001628'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%2300ADEF' stroke-width='6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <button class="brand" data-go="home" aria-label="Home">FUTSAL<span>ME</span></button>
    <div class="coins" id="coins" title="Coins"></div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-go="home">Home</button>
    <button data-go="team">Team</button>
    <button data-go="cards">Cards</button>
    <button data-go="packs">Packs</button>
    <button data-go="play">Play</button>
  </nav>
  <div id="overlay" hidden></div>
  <script src="app.js"></script>
</body>
</html>
